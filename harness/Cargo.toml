[package]
name = "ropus-harness"
version = "0.0.3"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[features]
default = []
# Enables the Rust and C SILK encode traces used only by diagnostic targets.
trace-silk-encode = ["ropus/trace-silk-encode"]

[dependencies]
ropus = { path = "../ropus" }
ogg = "0.9"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "ropus-compare"
path = "src/main.rs"

[[bin]]
name = "replay_fuzz_decode"
path = "src/bin/replay_fuzz_decode.rs"

[[bin]]
name = "diff_fuzz_decode"
path = "src/bin/diff_fuzz_decode.rs"

[[bin]]
name = "ropus-interframe"
path = "src/bin/interframe.rs"

[[bin]]
name = "repro-fuzz-roundtrip"
path = "src/bin/repro_fuzz_roundtrip.rs"

[[bin]]
name = "trace_silk_wb"
path = "src/bin/trace_silk_wb.rs"
required-features = ["trace-silk-encode"]

[[bin]]
name = "fuzz_repro_diff"
path = "src/bin/fuzz_repro_diff.rs"
required-features = ["trace-silk-encode"]

[[bin]]
name = "projection_roundtrip"
path = "src/bin/projection_roundtrip.rs"

[[bin]]
name = "corpus_diff"
path = "src/bin/corpus_diff.rs"

[[bin]]
name = "ctrl_decode_fixed"
path = "src/bin/ctrl_decode_fixed.rs"
