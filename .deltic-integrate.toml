  { program = "cargo", args = ["fmt", "--all", "--", "--check"] },
  { program = "cargo", args = ["clippy", "-p", "ropus", "--all-targets", "--locked", "--", "-D", "warnings"] },
  { program = "cargo", args = ["test", "-p", "ropus", "--locked"] },
]

